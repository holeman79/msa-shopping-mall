spring:
  application:
    name: member-service
  datasource:
    url: jdbc:postgresql://localhost:5432/member_db
    username: shopping
    password: shopping
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: member-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.shopping.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: "change-me-in-production-use-at-least-256-bits-of-entropy-here-please"
  expiration-hours: 24
  issuer: "msa-shopping-mall"

user-context-cache:
  ttl-minutes: 30

admin-seed:
  email: "admin@msa-shop.com"
  password: "admin1234"
  name: "관리자"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
