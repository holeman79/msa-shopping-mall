spring:
  application:
    name: auth-service
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auth-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.shopping.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: "change-me-in-production-use-at-least-256-bits-of-entropy-here-please"
  access-expiration-minutes: 30
  refresh-expiration-days: 14
  issuer: "msa-shopping-mall"

user-context-cache:
  # 리프레시 토큰 수명(14일)과 맞춤. 액세스 만료 후에도 refresh 흐름이 살아있는 동안 캐시 유지.
  ttl-minutes: 20160

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
